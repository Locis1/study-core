<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status | C Backend</title>
    <style>
        :root {
            --bg-dark: #09090b;
            --panel-bg: #18181b;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --accent: #10b981; /* Hacker-Grün */
            --border: #3f3f46;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .status-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 50px 70px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        .icon-container {
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Pulsierender Status-Punkt */
        .pulse-ring {
            width: 24px;
            height: 24px;
            background-color: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--accent);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            }

            70% {
                box-shadow: 0 0 0 20px rgba(16, 185, 129, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
            }
        }

        h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -1px;
        }

        p {
            color: var(--text-muted);
            margin-top: 12px;
            font-size: 1.1rem;
        }

        .tech-badge {
            display: inline-block;
            margin-top: 35px;
            background-color: var(--bg-dark);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: monospace;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="status-card">
        <div class="icon-container">
            <div class="pulse-ring"></div>
        </div>
        <h1>C Backend is Alive</h1>
        <p>Der native C-Webserver verarbeitet Anfragen.</p>

        <div class="tech-badge">
            WINSOCK2 | PORT 9090
        </div>
    </div>

</body>
</html>
