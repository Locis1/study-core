<div class="tutorial-page">
  <div class="meta-card">
    @if (metadata().author) {
      <div class="meta-item">
        <span class="meta-label">Author</span>
        <span class="meta-value">{{ metadata().author }}</span>
      </div>
    }

    @if (metadata().date) {
      <div class="meta-item">
        <span class="meta-label">Date</span>
        <span class="meta-value">{{ metadata().date }}</span>
      </div>
    }
  </div>

  @if (mdContent()) {
    <article class="markdown-body">
      <markdown [data]="mdContent()"></markdown>
    </article>
  }
</div>
