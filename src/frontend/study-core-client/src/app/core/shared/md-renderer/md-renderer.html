<div class="meta-card">
  @if (metadata().author) {
    <p><strong>Author:</strong> {{ metadata().author }}</p>
  }

  @if (metadata().date) {
    <p><strong>Date:</strong> {{ metadata().date }}</p>
  }
</div>

@if (mdContent()) {
  <div class="md-content">
    <markdown [data]="mdContent()"></markdown>
  </div>
}
